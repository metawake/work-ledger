[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "work-ledger"
version = "0.1.0"
description = "Agent diagnostics for LLM workflows. Record. Replay. Diff."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Alex Alexapolsky", email = "metawake@gmail.com"}
]
keywords = ["agent", "llm", "replay", "diff", "debugging", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]

dependencies = []

[project.optional-dependencies]
# Development
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "build>=1.0",
]

# Framework integrations (lower bounds based on tested versions)
pydantic-ai = ["pydantic-ai>=0.0.14"]
langchain = ["langchain>=0.2.0", "langchain-core>=0.2.0"]
langgraph = ["langgraph>=0.2.0"]
crewai = ["crewai>=0.50.0"]
llamaindex = ["llama-index>=0.10.0"]
openai = ["openai>=1.0.0,<2"]  # v1 API is stable
anthropic = ["anthropic>=0.25.0"]

# Storage backends
postgres = ["psycopg2-binary>=2.9"]
redis = ["redis>=4.0"]
mongodb = ["pymongo>=4.0"]
s3 = ["boto3>=1.26"]
gcs = ["google-cloud-storage>=2.0"]

# Bundles
integrations = [
    "work-ledger[pydantic-ai,langchain,langgraph,crewai,llamaindex,openai,anthropic]",
]
storage = [
    "work-ledger[postgres,redis,mongodb,s3,gcs]",
]
all = [
    "work-ledger[integrations,storage]",
]

[project.scripts]
work-ledger = "work_ledger.cli.main:main"

[project.urls]
Homepage = "https://github.com/metawake/work-ledger"
Repository = "https://github.com/metawake/work-ledger"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 88
target-version = ["py310"]
